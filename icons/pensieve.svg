<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="url(#pensBg)"/>
  <!-- Basin (stone bowl) — a wide shallow ellipse -->
  <path d="M88 260 Q88 232 108 220 L404 220 Q424 232 424 260 L424 316 Q424 404 256 404 Q88 404 88 316 Z"
        fill="url(#pensBowl)"/>
  <!-- Bowl outer rim -->
  <ellipse cx="256" cy="240" rx="168" ry="28" fill="#FFFFFF" fill-opacity="0.98"/>
  <ellipse cx="256" cy="240" rx="152" ry="20" fill="url(#pensSurface)"/>
  <!-- Ripple surface highlight -->
  <ellipse cx="256" cy="238" rx="132" ry="12" fill="#FFFFFF" fill-opacity="0.35"/>
  <!-- Concentric ripples -->
  <ellipse cx="256" cy="240" rx="60" ry="8" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4" fill="none"/>
  <ellipse cx="256" cy="240" rx="92" ry="12" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="3" fill="none"/>
  <ellipse cx="256" cy="240" rx="124" ry="16" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" fill="none"/>
  <!-- Memory strand rising above the basin -->
  <path d="M256 240 Q244 208 260 176 Q280 148 256 116"
        stroke="#FFFFFF"
        stroke-opacity="0.9"
        stroke-width="6"
        stroke-linecap="round"
        fill="none"/>
  <circle cx="256" cy="112" r="10" fill="#FFFFFF" fill-opacity="0.98"/>
  <defs>
    <linearGradient id="pensBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7B1"/>
      <stop offset="0.55" stop-color="#FFA582"/>
      <stop offset="1" stop-color="#FA8455"/>
    </linearGradient>
    <linearGradient id="pensBowl" x1="0" y1="220" x2="0" y2="404" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CCBFF0"/>
      <stop offset="1" stop-color="#7A63BD"/>
    </linearGradient>
    <linearGradient id="pensSurface" x1="0" y1="220" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7A63BD"/>
      <stop offset="1" stop-color="#CCBFF0"/>
    </linearGradient>
  </defs>
</svg>
