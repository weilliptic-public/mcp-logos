<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="url(#pensieveBg)"/>

  <!-- Pedestal -->
  <ellipse cx="256" cy="400" rx="76" ry="16" fill="url(#pensieveStoneDark)"/>
  <path d="M220 316 L292 316 L308 392 L204 392 Z" fill="url(#pensieveStone)"/>

  <!-- Basin: rim thickness, then rim top, then the memory surface -->
  <ellipse cx="256" cy="314" rx="140" ry="48" fill="url(#pensieveStoneDark)"/>
  <ellipse cx="256" cy="300" rx="140" ry="48" fill="url(#pensieveStone)"/>
  <ellipse cx="256" cy="298" rx="112" ry="34" fill="url(#pensieveMemory)" fill-opacity="0.95"/>

  <!-- Swirling memory -->
  <g stroke="#F3FBFF" fill="none" stroke-linecap="round">
    <path d="M166 296 C 196 272, 316 272, 346 296 C 326 312, 186 312, 166 296 Z" stroke-width="3" stroke-opacity="0.85"/>
    <path d="M186 292 C 210 306, 302 306, 326 292" stroke-width="2.5" stroke-opacity="0.6"/>
    <path d="M198 302 C 224 288, 288 288, 314 302" stroke-width="2.5" stroke-opacity="0.5"/>
  </g>

  <!-- Rising memory wisps -->
  <path d="M226 280 C 214 248, 232 226, 220 196" stroke="url(#pensieveWisp)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M276 276 C 292 240, 270 214, 286 178" stroke="url(#pensieveWisp)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Sparkles -->
  <circle cx="218" cy="188" r="5" fill="#F3FBFF"/>
  <circle cx="288" cy="170" r="4" fill="#F3FBFF" opacity="0.85"/>
  <circle cx="330" cy="222" r="3" fill="#F3FBFF" opacity="0.7"/>

  <defs>
    <linearGradient id="pensieveBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B1836"/>
      <stop offset="0.55" stop-color="#3B3372"/>
      <stop offset="1" stop-color="#5B4FA3"/>
    </linearGradient>
    <linearGradient id="pensieveStone" x1="116" y1="252" x2="396" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7E6F0"/>
      <stop offset="1" stop-color="#A8A3C4"/>
    </linearGradient>
    <linearGradient id="pensieveStoneDark" x1="116" y1="284" x2="396" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9890B8"/>
      <stop offset="1" stop-color="#6E6794"/>
    </linearGradient>
    <radialGradient id="pensieveMemory" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#BFE3FF"/>
      <stop offset="1" stop-color="#7FB3EA"/>
    </radialGradient>
    <linearGradient id="pensieveWisp" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#BFE3FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#F3FBFF"/>
    </linearGradient>
  </defs>
</svg>
