<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="url(#flowBg)"/>
  <!-- Edges (drawn under nodes) -->
  <g stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="10" stroke-linecap="round">
    <line x1="140" y1="140" x2="256" y2="220"/>
    <line x1="256" y1="220" x2="372" y2="140"/>
    <line x1="256" y1="220" x2="256" y2="332"/>
    <line x1="256" y1="332" x2="140" y2="400"/>
    <line x1="256" y1="332" x2="372" y2="400"/>
  </g>
  <!-- Arrowheads on outgoing edges -->
  <g fill="#FFFFFF" fill-opacity="0.98">
    <path d="M244 214 L268 214 L256 232 Z"/>
    <path d="M244 320 L268 320 L256 340 Z"/>
    <path d="M140 388 L164 388 L152 408 Z"/>
    <path d="M348 388 L372 388 L360 408 Z"/>
  </g>
  <!-- Nodes -->
  <circle cx="140" cy="140" r="42" fill="url(#flowNodeA)"/>
  <circle cx="372" cy="140" r="42" fill="url(#flowNodeB)"/>
  <circle cx="256" cy="220" r="54" fill="url(#flowNodeCenter)"/>
  <circle cx="256" cy="332" r="42" fill="url(#flowNodeB)"/>
  <circle cx="140" cy="400" r="42" fill="url(#flowNodeA)"/>
  <circle cx="372" cy="400" r="42" fill="url(#flowNodeA)"/>
  <!-- Center node inner dot -->
  <circle cx="256" cy="220" r="18" fill="#FFFFFF" fill-opacity="0.98"/>
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7B1"/>
      <stop offset="0.55" stop-color="#FFA582"/>
      <stop offset="1" stop-color="#FA8455"/>
    </linearGradient>
    <linearGradient id="flowNodeA" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#7A63BD"/>
      <stop offset="1" stop-color="#CCBFF0"/>
    </linearGradient>
    <linearGradient id="flowNodeB" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#CCBFF0"/>
      <stop offset="1" stop-color="#7A63BD"/>
    </linearGradient>
    <linearGradient id="flowNodeCenter" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#7A63BD"/>
      <stop offset="1" stop-color="#FA8455"/>
    </linearGradient>
