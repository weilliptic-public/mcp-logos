<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="url(#audBg)"/>
  <!-- Document (behind the lens) -->
  <path d="M120 128 Q120 108 140 108 L320 108 L376 164 L376 380 Q376 400 356 400 L140 400 Q120 400 120 380 Z"
        fill="#FFFFFF" fill-opacity="0.98"/>
  <!-- Folded corner -->
  <path d="M320 108 L376 164 L320 164 Z" fill="url(#audFold)"/>
  <!-- Document lines -->
  <rect x="148" y="188" width="180" height="12" rx="6" fill="url(#audLine)" fill-opacity="0.7"/>
  <rect x="148" y="216" width="152" height="10" rx="5" fill="url(#audLine)" fill-opacity="0.5"/>
  <rect x="148" y="244" width="196" height="10" rx="5" fill="url(#audLine)" fill-opacity="0.5"/>
  <rect x="148" y="272" width="132" height="10" rx="5" fill="url(#audLine)" fill-opacity="0.5"/>
  <rect x="148" y="300" width="176" height="10" rx="5" fill="url(#audLine)" fill-opacity="0.5"/>
  <rect x="148" y="328" width="112" height="10" rx="5" fill="url(#audLine)" fill-opacity="0.5"/>
  <!-- Magnifying glass -->
  <circle cx="332" cy="316" r="74" fill="#FFFFFF" fill-opacity="0.98"/>
  <circle cx="332" cy="316" r="60" fill="url(#audLens)" fill-opacity="0.35"/>
  <circle cx="332" cy="316" r="60" stroke="url(#audLensRing)" stroke-width="14" fill="none"/>
  <!-- Handle -->
  <rect x="376" y="360" width="80" height="24" rx="12" transform="rotate(45 376 360)" fill="url(#audHandle)"/>
  <!-- Checkmark inside lens -->
  <path d="M304 316 L326 340 L364 296"
        stroke="#FFFFFF"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>
  <defs>
    <linearGradient id="audBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7B1"/>
      <stop offset="0.55" stop-color="#FFA582"/>
      <stop offset="1" stop-color="#FA8455"/>
    </linearGradient>
    <linearGradient id="audFold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#CCBFF0"/>
      <stop offset="1" stop-color="#7A63BD"/>
    </linearGradient>
    <linearGradient id="audLine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#FA8455"/>
      <stop offset="1" stop-color="#7A63BD"/>
    </linearGradient>
    <linearGradient id="audLens" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#CCBFF0"/>
      <stop offset="1" stop-color="#7A63BD"/>
    </linearGradient>
    <linearGradient id="audLensRing" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#7A63BD"/>
      <stop offset="1" stop-color="#FA8455"/>
    </linearGradient>
    <linearGradient id="audHandle" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#7A63BD"/>
      <stop offset="1" stop-color="#CCBFF0"/>
    </linearGradient>
  </defs>
</svg>
