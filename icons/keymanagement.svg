<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="url(#keymgmtBg)"/>
  <!-- Key pictogram, rotated for a classic diagonal key look -->
  <g transform="rotate(-45 256 256)">
    <!-- Bow (ring) -->
    <circle cx="164" cy="256" r="68" fill="#FFFFFF" fill-opacity="0.98"/>
    <circle cx="164" cy="256" r="32" fill="url(#keymgmtBg)"/>
    <rect x="156" y="256" width="16" height="30" rx="4" fill="url(#keymgmtBg)"/>
    <!-- Shaft -->
    <rect x="222" y="236" width="192" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.98"/>
    <!-- Teeth -->
    <rect x="338" y="276" width="20" height="30" fill="#FFFFFF" fill-opacity="0.98"/>
    <rect x="374" y="276" width="20" height="42" fill="#FFFFFF" fill-opacity="0.98"/>
  </g>
  <!-- Key-purpose tags -->
  <circle cx="176" cy="424" r="16" fill="url(#keymgmtDot)" fill-opacity="1"/>
  <circle cx="224" cy="424" r="16" fill="url(#keymgmtDot)" fill-opacity="0.8"/>
  <circle cx="272" cy="424" r="16" fill="url(#keymgmtDot)" fill-opacity="0.6"/>
  <circle cx="320" cy="424" r="16" fill="url(#keymgmtDot)" fill-opacity="0.4"/>
  <defs>
    <linearGradient id="keymgmtBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7B1"/>
      <stop offset="0.55" stop-color="#FFA582"/>
      <stop offset="1" stop-color="#FA8455"/>
    </linearGradient>
    <linearGradient id="keymgmtDot" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#7A63BD"/>
      <stop offset="1" stop-color="#FA8455"/>
    </linearGradient>
  </defs>
</svg>
