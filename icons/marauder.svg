  <circle cx="256" cy="256" r="152" fill="#FFFFFF" fill-opacity="0.98"/>
  <circle cx="256" cy="256" r="136" fill="url(#marauderBg)"/>
  <circle cx="256" cy="256" r="120" fill="#FFFFFF" fill-opacity="0.98"/>
  <!-- Compass rose — 8-point star -->
  <!-- North (up) arrow, filled in purple accent -->
  <path d="M256 128 L272 244 L256 256 L240 244 Z" fill="url(#marauderNorth)"/>
  <!-- South (down) arrow -->
  <path d="M256 384 L272 268 L256 256 L240 268 Z" fill="url(#marauderMinor)" fill-opacity="0.8"/>
  <!-- East (right) arrow -->
  <path d="M384 256 L268 240 L256 256 L268 272 Z" fill="url(#marauderMinor)" fill-opacity="0.8"/>
  <!-- West (left) arrow -->
  <path d="M128 256 L244 240 L256 256 L244 272 Z" fill="url(#marauderMinor)" fill-opacity="0.8"/>
  <!-- Diagonal minor arrows (NE, SE, SW, NW) — thin -->
  <path d="M346 166 L268 244 L256 256 L246 246 Z" fill="url(#marauderMinor)" fill-opacity="0.55"/>
  <path d="M346 346 L268 268 L256 256 L246 266 Z" fill="url(#marauderMinor)" fill-opacity="0.55"/>
  <path d="M166 346 L244 268 L256 256 L266 266 Z" fill="url(#marauderMinor)" fill-opacity="0.55"/>
  <path d="M166 166 L244 244 L256 256 L266 246 Z" fill="url(#marauderMinor)" fill-opacity="0.55"/>
  <!-- Center pin -->
  <circle cx="256" cy="256" r="14" fill="url(#marauderPin)"/>
  <defs>
    <linearGradient id="marauderBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7B1"/>
      <stop offset="0.55" stop-color="#FFA582"/>
      <stop offset="1" stop-color="#FA8455"/>
    </linearGradient>
    <linearGradient id="marauderNorth" x1="256" y1="128" x2="256" y2="256" gradientUnits="userSpaceOnUse">
