    </linearGradient>
    <linearGradient id="marauderMinor" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#FA8455"/>
      <stop offset="1" stop-color="#7A63BD"/>
    </linearGradient>
    <linearGradient id="marauderPin" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
