<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="url(#orgregBg)"/>
  <!-- Edges: one-directional, master -> proxies (sync push direction) -->
  <g stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="184" x2="150" y2="322"/>
    <line x1="256" y1="184" x2="256" y2="352"/>
    <line x1="256" y1="184" x2="362" y2="322"/>
  </g>
  <!-- Arrowheads pointing away from master, toward each proxy -->
  <g fill="#FFFFFF" fill-opacity="0.98">
    <path d="M138 306 L166 312 L148 336 Z"/>
    <path d="M242 336 L270 336 L256 360 Z"/>
    <path d="M346 306 L374 312 L364 336 Z"/>
  </g>
  <!-- Proxy nodes -->
  <circle cx="150" cy="340" r="40" fill="url(#orgregProxy)"/>
  <circle cx="256" cy="370" r="40" fill="url(#orgregProxy)"/>
  <circle cx="362" cy="340" r="40" fill="url(#orgregProxy)"/>
  <!-- Master node: outer halo ring marks it as distinct from the proxies -->
  <circle cx="256" cy="168" r="66" fill="none" stroke="url(#orgregHalo)" stroke-opacity="0.9" stroke-width="10"/>
  <circle cx="256" cy="168" r="48" fill="url(#orgregMaster)"/>
  <circle cx="256" cy="168" r="16" fill="#FFFFFF" fill-opacity="0.98"/>
  <defs>
    <linearGradient id="orgregBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7B1"/>
      <stop offset="0.55" stop-color="#FFA582"/>
      <stop offset="1" stop-color="#FA8455"/>
    </linearGradient>
    <linearGradient id="orgregMaster" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#7A63BD"/>
      <stop offset="1" stop-color="#FA8455"/>
    </linearGradient>
    <linearGradient id="orgregHalo" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CCBFF0"/>
    </linearGradient>
    <linearGradient id="orgregProxy" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#CCBFF0"/>
      <stop offset="1" stop-color="#7A63BD"/>
    </linearGradient>
  </defs>
</svg>
