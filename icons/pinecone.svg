<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="url(#pineconeBg)"/>
  <!-- Stem -->
  <rect x="242" y="88" width="28" height="52" rx="8" fill="url(#pineconeStem)"/>
  <!-- Pinecone body: overlapping scale rows tapering downward -->
  <path d="M256 128
           C 176 128, 128 200, 128 264
           C 128 336, 200 408, 256 432
           C 312 408, 384 336, 384 264
           C 384 200, 336 128, 256 128 Z"
        fill="#FFFFFF" fill-opacity="0.98"/>
  <!-- Scale rows: horizontal offset diamonds giving the cone texture -->
  <g fill="url(#pineconeScale)" fill-opacity="0.85">
    <ellipse cx="200" cy="196" rx="24" ry="14"/>
    <ellipse cx="256" cy="184" rx="26" ry="14"/>
    <ellipse cx="312" cy="196" rx="24" ry="14"/>
    <ellipse cx="176" cy="228" rx="26" ry="16"/>
    <ellipse cx="232" cy="222" rx="28" ry="16"/>
    <ellipse cx="288" cy="222" rx="28" ry="16"/>
    <ellipse cx="336" cy="228" rx="26" ry="16"/>
    <ellipse cx="184" cy="270" rx="28" ry="16"/>
    <ellipse cx="244" cy="264" rx="30" ry="16"/>
    <ellipse cx="304" cy="264" rx="30" ry="16"/>
    <ellipse cx="332" cy="270" rx="28" ry="16"/>
    <ellipse cx="200" cy="316" rx="26" ry="15"/>
    <ellipse cx="256" cy="310" rx="28" ry="15"/>
    <ellipse cx="312" cy="316" rx="26" ry="15"/>
    <ellipse cx="220" cy="358" rx="22" ry="13"/>
    <ellipse cx="256" cy="350" rx="24" ry="13"/>
    <ellipse cx="292" cy="358" rx="22" ry="13"/>
    <ellipse cx="240" cy="392" rx="18" ry="10"/>
    <ellipse cx="272" cy="392" rx="18" ry="10"/>
  </g>

  <defs>
    <linearGradient id="pineconeBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7B1"/>
      <stop offset="0.55" stop-color="#FFA582"/>
      <stop offset="1" stop-color="#FA8455"/>
    </linearGradient>
    <linearGradient id="pineconeStem" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#7A63BD"/>
      <stop offset="1" stop-color="#CCBFF0"/>
    </linearGradient>
    <linearGradient id="pineconeScale" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#FFA582"/>
      <stop offset="1" stop-color="#7A63BD"/>
    </linearGradient>
  </defs>
</svg>
