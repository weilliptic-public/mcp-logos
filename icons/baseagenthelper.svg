<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="url(#agentBg)"/>
  <!-- Antenna -->
  <rect x="248" y="88" width="16" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.98"/>
  <circle cx="256" cy="88" r="14" fill="url(#agentAntenna)"/>
  <!-- Head -->
  <rect x="152" y="128" width="208" height="152" rx="36" fill="#FFFFFF" fill-opacity="0.98"/>
  <!-- Face inset -->
  <rect x="180" y="164" width="152" height="80" rx="20" fill="url(#agentFace)"/>
  <!-- Eyes -->
  <circle cx="220" cy="204" r="14" fill="#FFFFFF"/>
  <circle cx="292" cy="204" r="14" fill="#FFFFFF"/>
  <circle cx="220" cy="204" r="6" fill="#7A63BD"/>
  <circle cx="292" cy="204" r="6" fill="#7A63BD"/>
  <!-- Neck -->
  <rect x="232" y="280" width="48" height="20" rx="6" fill="#FFFFFF" fill-opacity="0.98"/>
  <!-- Body / chest plate -->
  <rect x="128" y="300" width="256" height="128" rx="28" fill="#FFFFFF" fill-opacity="0.98"/>
  <!-- Chest emblem — hex tag -->
  <path d="M256 328 L292 348 L292 388 L256 408 L220 388 L220 348 Z" fill="url(#agentEmblem)"/>
  <!-- Wrench, held on the right side, angled -->
  <g transform="rotate(35 384 356)">
    <rect x="360" y="336" width="80" height="18" rx="9" fill="#CCBFF0"/>
    <circle cx="356" cy="345" r="20" fill="#CCBFF0"/>
    <circle cx="356" cy="345" r="9" fill="url(#agentBg)"/>
  </g>
  <defs>
    <linearGradient id="agentBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7B1"/>
      <stop offset="0.55" stop-color="#FFA582"/>
      <stop offset="1" stop-color="#FA8455"/>
    </linearGradient>
    <linearGradient id="agentAntenna" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#7A63BD"/>
      <stop offset="1" stop-color="#CCBFF0"/>
    </linearGradient>
    <linearGradient id="agentFace" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#7A63BD"/>
      <stop offset="1" stop-color="#FA8455"/>
    </linearGradient>
    <linearGradient id="agentEmblem" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#7A63BD"/>
      <stop offset="1" stop-color="#CCBFF0"/>
    </linearGradient>
  </defs>
</svg>
